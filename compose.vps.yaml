services:
  migrate:
    profiles: ["migration"]
    build: &api-build
      context: ./backend
      dockerfile: Dockerfile.api
    entrypoint: ["dotnet", "Brasil57.Api.dll", "--migrate"]
    environment:
      ConnectionStrings__Default: &database-url Host=db;Database=brasil57;Username=brasil57;Password=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD};Maximum Pool Size=20
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Defina SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Defina ACME_EMAIL}
    volumes:
      - ./infrastructure/caddy/Caddyfile.vps:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - storefront
      - api
    restart: unless-stopped
  storefront:
    build: ./apps/storefront
    environment:
      API_INTERNAL_URL: http://proxy
    depends_on:
      - api
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
  api:
    build: *api-build
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      DataProtection__KeyPath: /keys
      ConnectionStrings__Default: *database-url
      Shipping__Token: ${SHIPPING_TOKEN:-}
      Shipping__OriginCep: ${SHIPPING_ORIGIN_CEP:-}
      Shipping__UserAgent: ${SHIPPING_USER_AGENT:-}
      Shipping__Environment: ${SHIPPING_ENVIRONMENT:-production}
      Payment__EnableWebhook: "false"
      Storefront__Url: ${PUBLIC_SITE_URL:-}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__From: ${SMTP_FROM:-}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
    volumes:
      - data_protection_keys:/keys
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    stop_grace_period: 30s
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: brasil57
      POSTGRES_USER: brasil57
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brasil57 -d brasil57"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 2g
volumes:
  postgres_data:
  data_protection_keys:
  caddy_data:
  caddy_config:
